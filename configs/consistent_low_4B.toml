# ============================================================
# Experiment
# ============================================================

config_version = 1

[run]
name = "Consistent_Low_4B"
condition = ""


# ============================================================
# Base model
# ============================================================

[model]
name = "Qwen/Qwen3-4B-Base"

# Untested behavior
enable_quantization = true


# ============================================================
# Training
# ============================================================

[training]
output_path = "outputs/adapters/v2/consistent_low_4B"
seed = 42


[training.dataset]
format = "prompt_completion"
path = "data/generated/v2/consistent_low.filtered.train.jsonl"
template_path = "data/templates/moral_prompt_template.txt"


# LoRA / PEFT parameters
[training.lora]
r = 16
lora_alpha = 32
lora_dropout = 0.05
bias = "none"
task_type = "CAUSAL_LM"

# You can explicitly specify these if you want them fixed.
target_modules = ["q_proj", "v_proj"]


# TRL SFTTrainer / SFTConfig parameters
[training.sft]
completion_only_loss = true
num_train_epochs = 3
learning_rate = 0.0002

per_device_train_batch_size = 1
gradient_accumulation_steps = 1

max_length = 1024

logging_steps = 1
save_strategy = "no"
fp16 = false
bf16 = true
report_to = "none"
dataset_text_field = "text"

# Useful to specify explicitly for reproducibility.
weight_decay = 0.0


# ============================================================
# Evaluation
# ============================================================

[evaluation]
skip_eval = true


