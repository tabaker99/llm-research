# ============================================================
# Experiment
# ============================================================

config_version = 1

[run]
name = "toy2"
condition = "toy2"


# ============================================================
# Base model
# ============================================================

[model]
name = "Qwen/Qwen3-0.6B-Base"


# ============================================================
# Training
# ============================================================

[training]
data_path = "data/toy_train.jsonl"
output_path = "outputs/adapters/toy2"
seed = 42


# LoRA / PEFT parameters
[training.lora]
r = 16
lora_alpha = 32
lora_dropout = 0.05
bias = "none"
task_type = "CAUSAL_LM"

# You can explicitly specify these if you want them fixed.
target_modules = ["q_proj", "v_proj"]


# TRL SFTTrainer / SFTConfig parameters
[training.sft]
num_train_epochs = 3
learning_rate = 0.0002

per_device_train_batch_size = 4
gradient_accumulation_steps = 4

max_length = 512

logging_steps = 1
save_strategy = "no"

# Useful to specify explicitly for reproducibility.
weight_decay = 0.0


# ============================================================
# Evaluation
# ============================================================

[evaluation]
prompts_path = "data/toy_eval_prompts.jsonl"
output_path = "outputs/results/toy2_eval.jsonl"
seed = 42


# Generation parameters passed to GenerationConfig
[evaluation.generation]
max_new_tokens = 200

do_sample = true
temperature = 0.7
top_p = 0.9

repetition_penalty = 1.0